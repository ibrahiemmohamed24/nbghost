[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nbghost"
version = "0.0.1"
description = "Catch hidden state, out-of-order cells, and unseeded randomness in Jupyter notebooks before your reviewer does."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ibrahim Mohamed Abdelaziz" }]
keywords = ["jupyter", "notebook", "reproducibility", "ci", "docker", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Framework :: Jupyter",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "nbformat>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
nbghost = "nbghost.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nbghost"]